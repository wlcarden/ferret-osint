# Membership safety review
#
# A perspective is an investigation type. Copy this file, rename it, and edit it
# to create another. The file name must match `name`.

name: membership_safety
title: Membership safety review
purpose: >
  Review an applicant to a club for court records and public statements that
  bear on the safety of other members. The applicant has been told about the
  review. The brief reports evidence; the membership committee decides.
subject_kind: person

# A case can only be opened on one of these. "notice" means the application told
# the applicant a review would happen; "consent" means they agreed to it.
allowed_bases:
  - consent
  - notice

sources:
  - id: va_statewide_case_search
    title: Virginia statewide case search
    kind: manual
    url: https://eapps.courts.state.va.us/ocis/landing
    covers: >
      Adult criminal cases in juvenile and domestic relations district courts,
      criminal and traffic cases in general district courts and select circuit
      courts. Civil protective orders are not confirmed as covered.
    instructions: >
      Search each spelling of the name. For every case found record the court,
      case number, charge, disposition, and the date of birth and address
      shown. Record a search that finds nothing as well.

  - id: md_case_search
    title: Maryland Judiciary Case Search
    kind: manual
    url: https://casesearch.courts.state.md.us/casesearch/
    covers: Coverage not confirmed. The site refuses automated reads.
    instructions: >
      Search each spelling of the name in criminal and civil records, including
      peace and protective orders. Record court, case number, charge or order
      type, disposition, and the date of birth and address shown.

  - id: dc_superior_court
    title: DC Superior Court case search
    kind: manual
    url: https://www.dccourts.gov/superior-court/cases-online
    covers: Coverage not confirmed. The site refuses automated reads.
    instructions: >
      Search each spelling of the name in criminal and domestic violence
      records. Record case number, charge, disposition, and any date of birth
      or address shown.

  - id: federal_courts
    title: Federal court dockets
    kind: adapter
    covers: Federal criminal and civil dockets. Most criminal cases are in state courts.

  # Accounts are listed on the application with the platform in front, for
  # example "bluesky:someone.bsky.social" or "facebook:jordan.whitlock.9".
  - id: bluesky_posts
    title: Bluesky posts from accounts the applicant listed
    kind: posts
    platform: bluesky
    covers: >
      Public posts, replies and reposts. Only accounts the applicant named on
      the application.

  - id: mastodon_posts
    title: Mastodon posts from accounts the applicant listed
    kind: posts
    platform: mastodon
    covers: >
      Public posts, replies and reposts on Mastodon-style servers, listed as
      "mastodon:name@server". Only accounts the applicant named.

  - id: captured_posts
    title: Posts a reviewer captured from other accounts the applicant listed
    kind: capture
    covers: >
      Facebook, Instagram, X, Reddit and any other platform that does not let a
      program read it. Covers only what the reviewer captured.
    instructions: >
      Open each listed account signed in as yourself. Go back as far as the
      review period. For each post record its date, its words and its link.
      Record an account where you found nothing as well.

report:
  include:
    - Every court or registry record tied to the applicant, with its outcome.
    - >
      Every public statement by the applicant that threatens, endorses or jokes
      about violence against people or property, quoted exactly with its date.
    - Any record that could not be tied to the applicant or ruled out.
  exclude:
    - Political opinions, party or ideology as such.
    - Health information.
    - Anything about family members or other third parties.

# How posts are read. Each post is read more than once by software, and the
# ones it reports come to the reviewer for a decision. Edit the wording freely:
# these lists are given to the reader word for word.
statements:
  lookback_years: 5
  report:
    - >
      Threats of violence against a person, a group or property, including
      veiled ones such as hinting that someone will be harmed, or describing
      watching or following a person.
    - >
      Statements that welcome, praise or call for violence against people, or
      that praise someone who carried out an attack.
    - >
      Jokes about harming people, including jokes about misusing a firearm at a
      range, a workplace, a school or a public place.
  leave_out:
    - >
      Political opinions, however strongly worded, that do not call for or
      welcome violence.
    - Lawful hunting, sport shooting, self-defence training and firearm ownership.
    - Figures of speech, and quotations from films, songs or history offered as such.
    - News of violence that the applicant does not welcome.
    - Video games and fiction.
  # A made-up post that must always be reported under the rules above. It is
  # slipped into every batch to show that the reader was reading.
  control_post: I am going to shoot my neighbor in the face tomorrow morning and I mean it.

caveats:
  - >
    A search that finds nothing is weak evidence. State court coverage is
    uneven and name searches miss records filed under another spelling.
  - >
    A record counts against an applicant only after they have been shown it and
    given the chance to say it is not theirs.
